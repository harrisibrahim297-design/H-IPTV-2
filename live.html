<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H Sports — Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #000; color: #fff; min-height: 100vh; }
    
    /* Top Sport Bar */
    .sport-nav { background: #000; padding: 12px; text-align: center; font-size: 14px; color: #ccc; border-bottom: 1px solid #222; }
    
    /* Match Header */
    .match-top { background: #111; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .team-side { text-align: center; flex: 1; }
    .team-icon { font-size: 28px; margin-bottom: 4px; }
    .team-name { font-size: 13px; color: #ddd; }
    .match-time { text-align: center; font-size: 12px; color: #888; }
    .live-indicator { color: #e53935; font-size: 11px; font-weight: bold; margin-bottom: 4px; }
    .fav-icon { font-size: 22px; color: #007bff; }
    
    /* Player Button */
    .player-row { background: #111; text-align: center; padding: 10px; border-bottom: 1px solid #222; }
    .player-btn { background: #007bff; color: white; border: none; padding: 8px 24px; border-radius: 20px; font-size: 14px; }
    
    /* Video Area */
    .video-area { background: #2a2a2a; height: 200px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #000; }
    .video-icon { font-size: 60px; color: #666; }
    
    /* Divider Line */
    .divider { display: flex; justify-content: space-around; padding: 8px 0; background: #111; border-bottom: 1px solid #222; }
    .divider span { width: 40px; height: 2px; background: #333; }
    
    /* Stream Options List */
    .stream-option { display: flex; align-items: center; justify-content: space-between; padding: 14px 15px; border-bottom: 1px solid #222; background: #111; }
    .stream-info { display: flex; flex-direction: column; }
    .stream-name { font-size: 14px; color: #eee; }
    .stream-source { font-size: 12px; color: #666; margin-top: 2px; }
    .watch-btn { background: #007bff; color: white; border: none; padding: 6px 14px; border-radius: 4px; font-size: 13px; text-decoration: none; display: inline-block; }
    
    .back-link { display: block; text-align: center; padding: 20px; color: #00cc88; text-decoration: none; font-size: 14px; border-top: 1px solid #222; margin-top: 10px; }
    .note { padding: 15px; font-size: 11px; color: #555; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>

  <!-- Sport Navigation -->
  <div class="sport-nav">FOOTBALL</div>

  <!-- Match Header -->
  <div class="match-top">
    <div class="team-side">
      <div class="team-icon">⚽</div>
      <div class="team-name">Fleetwood</div>
    </div>
    <div class="match-time">
      <div class="live-indicator">LIVE</div>
      <div>19:45 UK</div>
    </div>
    <div class="team-side">
      <div class="team-icon">⚽</div>
      <div class="team-name">Arsenal</div>
    </div>
    <div class="fav-icon">📌</div>
  </div>

  <!-- Player Button -->
  <div class="player-row">
    <button class="player-btn">Player 1</button>
  </div>

  <!-- Video Placeholder -->
  <div class="video-area">
    <div class="video-icon">📺</div>
  </div>

  <!-- Divider -->
  <div class="divider">
    <span></span><span></span><span></span>
  </div>

  <!-- Stream Options -->
  <div class="stream-option">
    <div class="stream-info">
      <div class="stream-name">Trendy47</div>
      <div class="stream-source">Sky Sports</div>
    </div>
    <a href="https://www.skysports.com/watch" target="_blank" class="watch-btn">▶ Watch</a>
  </div>

  <div class="stream-option">
    <div class="stream-info">
      <div class="stream-name">GOALIETREND</div>
      <div class="stream-source">BBC iPlayer</div>
    </div>
    <a href="https://www.bbc.co.uk/iplayer" target="_blank" class="watch-btn">▶ Watch</a>
  </div>

  <div class="stream-option">
    <div class="stream-info">
      <div class="stream-name">Sportsbest</div>
      <div class="stream-source">ITVX</div>
    </div>
    <a href="https://www.itv.com" target="_blank" class="watch-btn">▶ Watch</a>
  </div>

  <div class="stream-option">
    <div class="stream-info">
      <div class="stream-name">Ripplestream4u</div>
      <div class="stream-source">Sky Sports</div>
    </div>
    <a href="https://www.skysports.com/watch" target="_blank" class="watch-btn">▶ Watch</a>
  </div>

  <div class="note">
    ⓘ Video area is a placeholder. Clicking "Watch" opens the official stream in a new tab. All links are legal & safe.
  </div>

  <a href="index.html" class="back-link">← Back to Home</a>

</body>
</html>
